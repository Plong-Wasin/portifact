# Dokploy routes the configured domain to the app service and terminates TLS.
# Configure the domain in Dokploy and point it at service `app`, port 3000.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - portifact-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
    command: bun run db:migrate
    env_file:
      - .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    command: bun run start
    env_file:
      - .env
    environment:
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
    command: bun run worker
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  portifact-postgres:
